# GitLab CI/CD pipeline for the Pulumi GCP stack in `infra/`.
#
# Auth uses GCP Workload Identity Federation (WIF) -- see infra/gitlab-wif.ts
# for the resources this depends on. No static GCP credentials are stored in
# GitLab: each job exchanges a short-lived GitLab OIDC token for GCP access by
# impersonating the `gitlab-ci-deployer` service account.
#
# GitHub is the canonical repository (humans and cloud agents). A GitHub
# Action copies git refs here; this file remains the only production deploy path.
# See docs/FORGES.md.
#
# Required GitLab CI/CD variables (Settings > CI/CD > Variables):
#   PULUMI_ACCESS_TOKEN  - masked. Do NOT mark it Protected: GitLab withholds
#                          protected variables from unprotected feature
#                          branches, so `pulumi:preview` cannot log in.
#                          Pulumi state lives in Pulumi Cloud, not GCP.
#
# GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT below come from
# `pulumi stack output gitlabCiWifProviderName` /
# `gitlabCiServiceAccountEmail`. Update the placeholders (or move them
# into GitLab CI/CD variables) after the first apply.

default:
  image: google/cloud-sdk:slim
  # `docker.Image` (infra/index.ts) builds+pushes via a real Docker daemon, not
  # a CLI shell-out, so the runner needs one. Docker-in-Docker gives every job
  # a disposable daemon reachable at tcp://docker:2375; GitLab.com's shared
  # runners run in privileged mode already, so no extra runner config needed.
  services:
    - docker:24-dind
  before_script:
    # Self-contained: installs Node + Pulumi CLI on top of the gcloud image so
    # this file has no external Docker image dependency beyond Google's own.
    # For faster pipelines later, swap this for a prebuilt image with
    # node/pulumi/gcloud baked in.
    - apt-get update -qq && apt-get install -y -qq curl gnupg >/dev/null
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash - >/dev/null
    - apt-get install -y -qq nodejs >/dev/null
    - curl -fsSL https://get.pulumi.com | sh
    - export PATH="$PATH:$HOME/.pulumi/bin"
    - cd "${CI_PROJECT_DIR}/infra" && npm ci

variables:
  PULUMI_STACK: dev
  GCP_WORKLOAD_IDENTITY_PROVIDER: "projects/569199553236/locations/global/workloadIdentityPools/gitlab-pool/providers/gitlab-provider"
  GCP_SERVICE_ACCOUNT: "gitlab-ci-deployer@pulumi-gcp-ed-msolla.iam.gserviceaccount.com"
  GCP_ARTIFACT_REGISTRY_HOST: "us-central1-docker.pkg.dev"
  # Point the Docker daemon that Pulumi's docker provider looks for at the
  # dind service. No TLS: both containers are ephemeral and only exist for
  # this one job, so there's no other tenant to protect against.
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

stages:
  - preview
  - deploy

# Shared WIF handshake, reused by both jobs via `extends`. Each job requests
# its own short-lived GCP_ID_TOKEN (id_tokens are minted per job, not shared),
# but the token exchange + login steps only need to be written once.
.gcp_wif_auth:
  id_tokens:
    GCP_ID_TOKEN:
      aud: https://iam.googleapis.com/${GCP_WORKLOAD_IDENTITY_PROVIDER}
  before_script:
    - !reference [default, before_script]
    # 1. Save the GitLab-issued OIDC token that GCP will exchange for access.
    - echo "${GCP_ID_TOKEN}" > /tmp/gitlab-oidc-token.jwt
    # 2. Build an `external_account` credential config that impersonates
    #    GCP_SERVICE_ACCOUNT using that token. This only succeeds because the
    #    token's `project_path` claim matches the attribute condition on the
    #    WIF provider, and that principal set holds `iam.workloadIdentityUser`
    #    on the service account (both set up in infra/gitlab-wif.ts).
    - >
      gcloud iam workload-identity-pools create-cred-config
      "${GCP_WORKLOAD_IDENTITY_PROVIDER}"
      --service-account="${GCP_SERVICE_ACCOUNT}"
      --credential-source-file=/tmp/gitlab-oidc-token.jwt
      --output-file=/tmp/gcp-cred-config.json
    # 3. Exchange it for short-lived GCP credentials. Pulumi's GCP provider
    #    picks these up automatically via Application Default Credentials.
    - gcloud auth login --cred-file=/tmp/gcp-cred-config.json
    - export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-cred-config.json
    # 4. `docker.Image` pushes via ~/.docker/config.json credential helpers,
    #    same as the Docker CLI -- it does not inherit gcloud's ADC on its
    #    own. Wire up the credential helper for Artifact Registry now that
    #    gcloud is authenticated as the deployer SA (mirrors the one-time
    #    local setup step in the README).
    - gcloud auth configure-docker "${GCP_ARTIFACT_REGISTRY_HOST}" --quiet
    # Protected GitLab variables are empty on unprotected branches. Fail
    # with that cause instead of Pulumi's non-interactive login error.
    - |
      if [ -z "${PULUMI_ACCESS_TOKEN:-}" ]; then
        echo "PULUMI_ACCESS_TOKEN is empty. In GitLab: Settings > CI/CD > Variables > PULUMI_ACCESS_TOKEN: keep Masked, uncheck Protected. See docs/FORGES.md."
        exit 1
      fi
    - pulumi login
    - pulumi stack select "${PULUMI_STACK}"

pulumi:preview:
  extends: .gcp_wif_auth
  stage: preview
  interruptible: true
  rules:
    # Native GitLab merge requests (optional review UI).
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # GitHub-mirrored feature branches arrive as a normal `push`, not an
    # MR event. Skip when a GitLab MR is already open for this branch so
    # we do not run preview twice.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main" && $CI_OPEN_MERGE_REQUESTS == null'
  script:
    - pulumi preview --stack "${PULUMI_STACK}"

pulumi:deploy:
  extends: .gcp_wif_auth
  stage: deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  script:
    - pulumi up --yes --stack "${PULUMI_STACK}"
